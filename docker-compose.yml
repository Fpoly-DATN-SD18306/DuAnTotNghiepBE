version: '1.0'

services :
    be:
      image: gcr.io/duantotnghiep-444809/duantotnghiep-be:latest
      container_name: bedatn
      build:
        context : .
        dockerfile: Dockerfile
      ports:
        - "8080:8080"
      environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/duantotnghiep
        SPRING_DATASOURCE_USERNAME: sa
        SPRING_DATASOURCE_PASSWORD: 1234
      depends_on:
        - mysql
    fe :
      image: gcr.io/duantotnghiep-444809/frontend

    mysql:
      image: mysql:8.0
      container_name: database
      environment:
        MYSQL_ROOT_PASSWORD: 12345
        MYSQL_DATABASE: duantotnghiep
        MYSQL_USER: sa
        MYSQL_PASSWORD: 1234