version: '3.8'

services :
    be:
      container_name: bedatn
      build:
        context : .
        dockerfile: Dockerfile
      ports:
        - "8080:8080"
      environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/duantotnghiep
        SPRING_DATASOURCE_USERNAME: sa
        SPRING_DATASOURCE_PASSWORD: 1234
        host.be: "http://bedatn:8080"
        host.fe: "http://fedatn:4200"
      depends_on:
        - mysql
        - fe
    fe:
      container_name: fedatn
      build:
        context: /home/phannhatlong44/DuAnTotNghiepFE
        dockerfile: Dockerfile
      ports:
        - "4200:4200"
    mysql:
      image: mysql:8.0
      container_name: database
      environment:
        MYSQL_ROOT_PASSWORD: 12345
        MYSQL_DATABASE: duantotnghiep
        MYSQL_USER: sa
        MYSQL_PASSWORD: 1234